<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pixel Gradient — mini-tools</title>
  <link rel="stylesheet" href="/styles.css" />
  <style>
    :root {
      --panel-w: 320px;
    }
    body { overflow: hidden; }
    .tool-shell {
      display: grid;
      grid-template-columns: 1fr var(--panel-w);
      gap: 0;
      height: 100vh;
      min-height: 100vh;
    }
    .stage {
      position: relative;
      background:
        linear-gradient(45deg, var(--line) 25%, transparent 25%) 0 0 / 16px 16px,
        linear-gradient(-45deg, var(--line) 25%, transparent 25%) 0 8px / 16px 16px,
        linear-gradient(45deg, transparent 75%, var(--line) 75%) 8px -8px / 16px 16px,
        linear-gradient(-45deg, transparent 75%, var(--line) 75%) 8px 0 / 16px 16px,
        var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: 28px;
    }
    .stage canvas {
      max-width: 100%;
      max-height: 100%;
      display: block;
      border-radius: 4px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.18), 0 2px 6px rgba(0,0,0,0.08);
    }
    .panel {
      border-left: 1px solid var(--line);
      background: var(--card);
      overflow-y: auto;
      padding: 18px 18px 80px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }
    .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--line);
    }
    .panel-head .back {
      font-size: 12px;
      color: var(--muted);
    }
    .panel-head .back:hover { color: var(--ink); }
    .panel-head h1 {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }
    .group { display: flex; flex-direction: column; gap: 10px; }
    .group-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      font-weight: 600;
    }
    .row {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 10px;
    }
    .row label {
      font-size: 12.5px;
      color: var(--ink);
    }
    .row .val {
      font-size: 11.5px;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
      min-width: 38px;
      text-align: right;
    }
    .row input[type="range"] {
      grid-column: 1 / -1;
      width: 100%;
      accent-color: var(--ink);
    }
    .seg {
      display: grid;
      grid-template-columns: 1fr 1fr;
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
    }
    .seg button {
      background: transparent;
      border: 0;
      padding: 8px;
      font-size: 12px;
      cursor: pointer;
      color: var(--muted);
      font-family: inherit;
    }
    .seg button[aria-pressed="true"] {
      background: var(--ink);
      color: var(--bg);
    }
    .palette {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
    }
    .swatch {
      aspect-ratio: 1;
      border-radius: 6px;
      border: 1px solid var(--line);
      position: relative;
      overflow: hidden;
      cursor: pointer;
    }
    .swatch input {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      cursor: pointer;
    }
    .file-drop {
      border: 1px dashed var(--line);
      border-radius: 8px;
      padding: 18px;
      text-align: center;
      font-size: 12.5px;
      color: var(--muted);
      cursor: pointer;
      transition: border-color 120ms, color 120ms;
    }
    .file-drop:hover, .file-drop.is-drag {
      border-color: var(--ink);
      color: var(--ink);
    }
    .file-drop input { display: none; }
    .file-preview {
      margin-top: 8px;
      border-radius: 6px;
      overflow: hidden;
      border: 1px solid var(--line);
      aspect-ratio: 16/9;
      background: var(--bg);
      display: none;
    }
    .file-preview img {
      width: 100%; height: 100%; object-fit: cover; display: block;
    }
    .file-preview.is-set { display: block; }
    .btn-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    button.btn {
      background: var(--ink);
      color: var(--bg);
      border: 0;
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 12.5px;
      font-weight: 500;
      cursor: pointer;
      font-family: inherit;
    }
    button.btn.ghost {
      background: transparent;
      color: var(--ink);
      border: 1px solid var(--line);
    }
    button.btn:hover { opacity: 0.88; }
    select {
      width: 100%;
      padding: 8px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: var(--bg);
      color: var(--ink);
      font-family: inherit;
      font-size: 12.5px;
    }
    @media (max-width: 760px) {
      .tool-shell { grid-template-columns: 1fr; grid-template-rows: 1fr auto; }
      .stage { padding: 14px; }
      .panel { border-left: 0; border-top: 1px solid var(--line); max-height: 50vh; }
    }
  </style>
</head>
<body>
  <div class="tool-shell">
    <div class="stage">
      <canvas id="canvas" width="900" height="900"></canvas>
    </div>

    <aside class="panel">
      <div class="panel-head">
        <a class="back" href="/">← mini-tools</a>
        <h1>Pixel Gradient</h1>
      </div>

      <div class="group">
        <div class="group-title">Source</div>
        <div class="seg" role="tablist">
          <button id="src-palette" aria-pressed="true">Palette</button>
          <button id="src-image" aria-pressed="false">Image</button>
        </div>

        <div id="palette-ui">
          <div class="palette" id="palette"></div>
        </div>

        <div id="image-ui" hidden>
          <label class="file-drop" id="file-drop">
            Click or drop an image
            <input type="file" id="file-input" accept="image/*" />
          </label>
          <div class="file-preview" id="file-preview"><img id="file-preview-img" alt="" /></div>
        </div>
      </div>

      <div class="group">
        <div class="group-title">Pixels</div>
        <div class="row"><label>Cell size</label><span class="val" id="v-cell">36</span></div>
        <input type="range" id="cell" min="8" max="120" value="36" />

        <div class="row"><label>Density</label><span class="val" id="v-density">0.85</span></div>
        <input type="range" id="density" min="0.1" max="1" step="0.01" value="0.85" />

        <div class="row"><label>Jitter</label><span class="val" id="v-jitter">0.5</span></div>
        <input type="range" id="jitter" min="0" max="1" step="0.01" value="0.5" />

        <div class="row"><label>Layers</label><span class="val" id="v-layers">3</span></div>
        <input type="range" id="layers" min="1" max="5" step="1" value="3" />

        <div class="row"><label>Pixel opacity</label><span class="val" id="v-alpha">0.55</span></div>
        <input type="range" id="alpha" min="0.1" max="1" step="0.01" value="0.55" />

        <div class="row"><label>Cluster focus</label><span class="val" id="v-cluster">0.55</span></div>
        <input type="range" id="cluster" min="0" max="1" step="0.01" value="0.55" />
      </div>

      <div class="group">
        <div class="group-title">Base gradient</div>
        <div class="row"><label>Softness</label><span class="val" id="v-soft">0.7</span></div>
        <input type="range" id="soft" min="0.2" max="1.4" step="0.01" value="0.7" />

        <div class="row"><label>Speed</label><span class="val" id="v-speed">0.4</span></div>
        <input type="range" id="speed" min="0" max="2" step="0.01" value="0.4" />
      </div>

      <div class="group">
        <div class="group-title">Finish</div>
        <div class="row"><label>Grain</label><span class="val" id="v-grain">0.25</span></div>
        <input type="range" id="grain" min="0" max="1" step="0.01" value="0.25" />

        <div class="row"><label>Aspect</label></div>
        <select id="aspect">
          <option value="1:1" selected>1:1 — Square</option>
          <option value="4:5">4:5 — Portrait</option>
          <option value="9:16">9:16 — Story</option>
          <option value="16:9">16:9 — Landscape</option>
          <option value="3:4">3:4</option>
        </select>
      </div>

      <div class="btn-row">
        <button class="btn ghost" id="randomize">Randomize</button>
        <button class="btn" id="export">Export PNG</button>
      </div>
    </aside>
  </div>

  <script>
  (() => {
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    // Offscreen for base gradient sampling
    const base = document.createElement('canvas');
    const bctx = base.getContext('2d', { willReadFrequently: true });

    // State
    const state = {
      source: 'palette',
      palette: ['#FFF1E0', '#F8C4D8', '#FF6B9D', '#FF8A3D', '#FFE45C'],
      image: null,
      cell: 36,
      density: 0.85,
      jitter: 0.5,
      layers: 3,
      alpha: 0.55,
      cluster: 0.55,
      soft: 0.7,
      speed: 0.4,
      grain: 0.25,
      aspect: '1:1',
      seed: Math.floor(Math.random() * 1e6),
    };

    // Deterministic RNG so randomization is reproducible per frame layer
    function mulberry32(a) {
      return function() {
        a |= 0; a = a + 0x6D2B79F5 | 0;
        let t = a;
        t = Math.imul(t ^ (t >>> 15), t | 1);
        t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }

    // Resize canvas based on aspect
    function resize() {
      const [a, b] = state.aspect.split(':').map(Number);
      const long = 1200;
      const w = a >= b ? long : Math.round(long * a / b);
      const h = b > a ? long : Math.round(long * b / a);
      canvas.width = w; canvas.height = h;
      base.width = Math.round(w / 2);
      base.height = Math.round(h / 2);
    }

    // Build palette swatch UI
    const paletteEl = document.getElementById('palette');
    function renderPaletteUI() {
      paletteEl.innerHTML = '';
      state.palette.forEach((c, i) => {
        const sw = document.createElement('label');
        sw.className = 'swatch';
        sw.style.background = c;
        const input = document.createElement('input');
        input.type = 'color';
        input.value = c;
        input.addEventListener('input', (e) => {
          state.palette[i] = e.target.value;
          sw.style.background = e.target.value;
        });
        sw.appendChild(input);
        paletteEl.appendChild(sw);
      });
    }
    renderPaletteUI();

    // Source switcher
    const tabPalette = document.getElementById('src-palette');
    const tabImage = document.getElementById('src-image');
    const paletteUI = document.getElementById('palette-ui');
    const imageUI = document.getElementById('image-ui');
    function setSource(s) {
      state.source = s;
      tabPalette.setAttribute('aria-pressed', s === 'palette');
      tabImage.setAttribute('aria-pressed', s === 'image');
      paletteUI.hidden = s !== 'palette';
      imageUI.hidden = s !== 'image';
    }
    tabPalette.addEventListener('click', () => setSource('palette'));
    tabImage.addEventListener('click', () => setSource('image'));

    // Image upload
    const fileInput = document.getElementById('file-input');
    const fileDrop = document.getElementById('file-drop');
    const filePreview = document.getElementById('file-preview');
    const filePreviewImg = document.getElementById('file-preview-img');

    function loadImageFile(file) {
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          state.image = img;
          filePreviewImg.src = img.src;
          filePreview.classList.add('is-set');
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }
    fileInput.addEventListener('change', (e) => loadImageFile(e.target.files[0]));
    ['dragenter', 'dragover'].forEach(ev =>
      fileDrop.addEventListener(ev, (e) => { e.preventDefault(); fileDrop.classList.add('is-drag'); }));
    ['dragleave', 'drop'].forEach(ev =>
      fileDrop.addEventListener(ev, (e) => { e.preventDefault(); fileDrop.classList.remove('is-drag'); }));
    fileDrop.addEventListener('drop', (e) => {
      if (e.dataTransfer.files[0]) loadImageFile(e.dataTransfer.files[0]);
    });

    // Bind range inputs
    function bindRange(id, key, label) {
      const el = document.getElementById(id);
      const val = document.getElementById(label);
      el.addEventListener('input', (e) => {
        const v = el.step && el.step !== '1' ? parseFloat(e.target.value) : parseInt(e.target.value, 10);
        state[key] = v;
        val.textContent = (typeof v === 'number' && el.step && el.step !== '1') ? v.toFixed(2) : v;
      });
    }
    bindRange('cell', 'cell', 'v-cell');
    bindRange('density', 'density', 'v-density');
    bindRange('jitter', 'jitter', 'v-jitter');
    bindRange('layers', 'layers', 'v-layers');
    bindRange('alpha', 'alpha', 'v-alpha');
    bindRange('cluster', 'cluster', 'v-cluster');
    bindRange('soft', 'soft', 'v-soft');
    bindRange('speed', 'speed', 'v-speed');
    bindRange('grain', 'grain', 'v-grain');

    document.getElementById('aspect').addEventListener('change', (e) => {
      state.aspect = e.target.value;
      resize();
    });

    // Randomize
    document.getElementById('randomize').addEventListener('click', () => {
      state.seed = Math.floor(Math.random() * 1e6);
      if (state.source === 'palette') {
        // Generate a new harmonious palette
        const hueBase = Math.random() * 360;
        const spread = 30 + Math.random() * 80;
        state.palette = Array.from({ length: 5 }, (_, i) => {
          const h = (hueBase + (i - 2) * spread / 2 + 360) % 360;
          const s = 60 + Math.random() * 30;
          const l = 50 + (i - 2) * 8 + Math.random() * 10;
          return hslToHex(h, s, Math.max(20, Math.min(92, l)));
        });
        renderPaletteUI();
      }
    });

    function hslToHex(h, s, l) {
      s /= 100; l /= 100;
      const k = n => (n + h / 30) % 12;
      const a = s * Math.min(l, 1 - l);
      const f = n => l - a * Math.max(-1, Math.min(k(n) - 3, 9 - k(n), 1));
      const to255 = v => Math.round(255 * v).toString(16).padStart(2, '0');
      return `#${to255(f(0))}${to255(f(8))}${to255(f(4))}`;
    }

    // Export
    document.getElementById('export').addEventListener('click', () => {
      const a = document.createElement('a');
      a.download = `pixel-gradient-${Date.now()}.png`;
      a.href = canvas.toDataURL('image/png');
      a.click();
    });

    // ── Render: base gradient (animated) ──────────────────────
    function drawBase(t) {
      const w = base.width, h = base.height;

      if (state.source === 'image' && state.image) {
        // Slowly pan / zoom the image
        const z = 1.15 + 0.06 * Math.sin(t * 0.0003);
        const dx = Math.sin(t * 0.00025) * w * 0.08;
        const dy = Math.cos(t * 0.0002) * h * 0.08;
        bctx.fillStyle = '#000';
        bctx.fillRect(0, 0, w, h);
        const img = state.image;
        const r = Math.max(w / img.width, h / img.height) * z;
        const iw = img.width * r, ih = img.height * r;
        bctx.drawImage(img, (w - iw) / 2 + dx, (h - ih) / 2 + dy, iw, ih);
        // Soften
        bctx.filter = `blur(${Math.round(8 * state.soft)}px)`;
        bctx.drawImage(base, 0, 0);
        bctx.filter = 'none';
        return;
      }

      // Palette base — multiple animated radial gradients composited
      bctx.fillStyle = state.palette[0];
      bctx.fillRect(0, 0, w, h);

      const speed = state.speed * 0.0005;
      const soft = state.soft;
      const cs = state.palette.slice(1);
      cs.forEach((color, i) => {
        const phase = i * 1.7 + state.seed * 0.001;
        const cx = w * (0.5 + 0.45 * Math.sin(t * speed * (0.6 + i * 0.2) + phase));
        const cy = h * (0.5 + 0.45 * Math.cos(t * speed * (0.5 + i * 0.23) + phase * 1.3));
        const r = Math.max(w, h) * (0.5 + 0.3 * soft);
        const g = bctx.createRadialGradient(cx, cy, 0, cx, cy, r);
        g.addColorStop(0, color);
        g.addColorStop(1, color + '00');
        bctx.globalCompositeOperation = 'lighter';
        bctx.fillStyle = g;
        bctx.fillRect(0, 0, w, h);
      });
      bctx.globalCompositeOperation = 'source-over';
    }

    // ── Sample helpers ────────────────────────────────────────
    let baseData = null;
    function refreshSamples() {
      baseData = bctx.getImageData(0, 0, base.width, base.height);
    }
    function sample(nx, ny) {
      if (!baseData) return [255, 255, 255, 255];
      const x = Math.max(0, Math.min(base.width - 1, Math.floor(nx * base.width)));
      const y = Math.max(0, Math.min(base.height - 1, Math.floor(ny * base.height)));
      const i = (y * base.width + x) * 4;
      const d = baseData.data;
      return [d[i], d[i + 1], d[i + 2], d[i + 3]];
    }
    const rgba = (c, a) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;

    // ── Render: smart pixels ──────────────────────────────────
    function drawPixels(t) {
      const W = canvas.width, H = canvas.height;
      const rand = mulberry32(state.seed);

      // Clustering: how concentrated the pixels are
      const cluster = state.cluster;
      const cx = 0.5, cy = 0.5;
      const focusR = 0.5 + (1 - cluster) * 0.6; // bigger = more spread

      for (let L = 0; L < state.layers; L++) {
        const layerRand = mulberry32(state.seed + L * 9919);
        const cellPx = state.cell * (1 + L * 0.12); // each layer slightly different scale
        const cols = Math.ceil(W / cellPx);
        const rows = Math.ceil(H / cellPx);
        const layerAlpha = state.alpha * (1 - L * 0.12);

        for (let r = 0; r < rows; r++) {
          for (let c = 0; c < cols; c++) {
            // Distance from cluster center (normalized)
            const ncx = (c + 0.5) / cols;
            const ncy = (r + 0.5) / rows;
            const dx = ncx - cx, dy = ncy - cy;
            const d = Math.sqrt(dx * dx + dy * dy);
            // Probability falls off with distance, modulated by cluster
            const fall = Math.max(0, 1 - d / focusR);
            const prob = state.density * (cluster * fall + (1 - cluster));

            if (layerRand() > prob) continue;

            // Jitter position
            const j = state.jitter;
            const jx = (layerRand() - 0.5) * cellPx * j * 1.4;
            const jy = (layerRand() - 0.5) * cellPx * j * 1.4;
            const x = c * cellPx + jx;
            const y = r * cellPx + jy;

            // Size slight variation
            const sz = cellPx * (0.9 + layerRand() * 0.25);

            // Sample two points from base — gives the cell its directional gradient
            const sample1 = sample(ncx, ncy);
            // Offset for the second sample — gives gradient direction
            const angle = (layerRand() * Math.PI * 2);
            const off = 0.04 + 0.08 * layerRand();
            const sx2 = Math.max(0, Math.min(1, ncx + Math.cos(angle) * off));
            const sy2 = Math.max(0, Math.min(1, ncy + Math.sin(angle) * off));
            const sample2 = sample(sx2, sy2);

            // Build small linear gradient inside the cell
            const gx1 = x, gy1 = y;
            const gx2 = x + Math.cos(angle) * sz, gy2 = y + Math.sin(angle) * sz;
            const g = ctx.createLinearGradient(gx1, gy1, gx2, gy2);
            g.addColorStop(0, rgba(sample1, layerAlpha));
            g.addColorStop(1, rgba(sample2, layerAlpha));
            ctx.fillStyle = g;
            ctx.fillRect(x, y, sz, sz);
          }
        }
      }
    }

    // ── Grain ─────────────────────────────────────────────────
    let grainCanvas = null;
    function ensureGrain() {
      if (grainCanvas && grainCanvas.width === canvas.width && grainCanvas.height === canvas.height) return;
      grainCanvas = document.createElement('canvas');
      grainCanvas.width = canvas.width;
      grainCanvas.height = canvas.height;
      const gctx = grainCanvas.getContext('2d');
      const id = gctx.createImageData(canvas.width, canvas.height);
      const d = id.data;
      for (let i = 0; i < d.length; i += 4) {
        const n = (Math.random() * 255) | 0;
        d[i] = d[i + 1] = d[i + 2] = n;
        d[i + 3] = 255;
      }
      gctx.putImageData(id, 0, 0);
    }

    function drawGrain() {
      if (state.grain <= 0.001) return;
      ensureGrain();
      ctx.save();
      ctx.globalAlpha = state.grain * 0.35;
      ctx.globalCompositeOperation = 'overlay';
      ctx.drawImage(grainCanvas, 0, 0);
      ctx.restore();
    }

    // ── Main loop ─────────────────────────────────────────────
    function frame(t) {
      drawBase(t);
      refreshSamples();
      // Draw scaled base as backdrop
      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = 'high';
      ctx.drawImage(base, 0, 0, canvas.width, canvas.height);
      drawPixels(t);
      drawGrain();
      requestAnimationFrame(frame);
    }

    resize();
    requestAnimationFrame(frame);
  })();
  </script>
</body>
</html>
